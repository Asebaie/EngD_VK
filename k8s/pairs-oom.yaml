apiVersion: batch/v1
kind: Job
metadata:
  name: pairs-oom
  namespace: hw5
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: pairs
          image: hw5-pairs:1
          args: ["full"]
          env:
            - name: S3_ENDPOINT
              value: rustfs:9000
          envFrom:
            - secretRef:
                name: s3
          resources:
            requests:
              cpu: 500m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 128Mi
